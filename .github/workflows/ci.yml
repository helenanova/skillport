name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run tests (symlink-dependent tests skip without privilege)
        run: npm test

  fixture-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all fixtures and publish the compatibility report
        run: npm run check:fixtures

  package-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Pack and install the npm artifact
        run: |
          smoke="$RUNNER_TEMP/skillport-package-smoke"
          mkdir -p "$smoke/pack" "$smoke/install"
          tarball=$(npm pack --silent --pack-destination "$smoke/pack")
          cd "$smoke/install"
          npm init -y --silent
          npm install --silent "$smoke/pack/$tarball"
      - name: Run installed fixture and CLI checks
        run: |
          package="$RUNNER_TEMP/skillport-package-smoke/install/node_modules/skillport"
          node "$package/scripts/verify-fixtures.js"
          node "$package/bin/skillport.js" check "$package/fixtures/valid-minimal" --json > /dev/null
